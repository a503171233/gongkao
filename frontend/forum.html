<style>
:root {
  --paper:      #f6f1e7;
  --paper-2:    #efe7d6;
  --card:       #fffaf0;
  --card-2:     #fbf4e4;
  --ink:        #3d3a33;
  --ink-2:      #6b655a;
  --ink-3:      #6E6657;
  --wood:       #8b5e3c;
  --wood-deep:  #6f4a2d;
  --gold:       #c9a05a;
  --gold-deep:  #a5813f;
  --gold-soft:  #e6d3ac;
  --good:       #7a9e6d;
  --bad:        #b45a4a;
  --line:       #e2d9c6;
  --line-2:     #d2c5ab;
  --shadow-1:   0 1px 3px rgba(93,72,41,.08), 0 1px 2px rgba(93,72,41,.05);
  --shadow-2:   0 6px 20px rgba(93,72,41,.12), 0 2px 6px rgba(93,72,41,.06);
  --radius:     14px;
  --radius-s:   8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", "Noto Serif SC", serif;
  background:
    radial-gradient(1200px 500px at 85% -5%, rgba(201,160,90,.09), transparent 60%),
    radial-gradient(900px 420px at -10% 10%, rgba(139,94,60,.07), transparent 55%),
    var(--paper);
  color: var(--ink); line-height: 1.75; -webkit-font-smoothing: antialiased; min-height: 100vh;
}
a { color: var(--wood-deep); text-decoration: none; }
.knav {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 28px 12px;
  background: rgba(246,241,231,.88); backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--ink); font-size: 16px; }
.brand .mark {
  width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, var(--wood), var(--gold));
  color: #fffaf0; display: grid; place-items: center; font-size: 16px; font-weight: 800; box-shadow: var(--shadow-1);
}
.knav .links { display: flex; gap: 6px; margin-left: auto; }
.knav .links a { padding: 7px 14px; border-radius: 9px; font-size: 13.5px; color: var(--ink-2); font-weight: 600; }
.knav .links a:hover { background: var(--paper-2); color: var(--wood-deep); }
.knav .links a.active { background: var(--gold-soft); color: var(--wood-deep); font-weight: 700; }
.wrap { max-width: 940px; margin: 0 auto; padding: 24px 20px 60px; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head h1 { font-size: 24px; font-weight: 800; }
.page-head p { font-size: 13px; color: var(--ink-3); }
.head-side { margin-left: auto; display: flex; gap: 10px; align-items: center; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-1); overflow: hidden; }
.panel-head { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 10px;
  align-items: center; flex-wrap: wrap; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex: 1; min-width: 240px; }
.toolbar .grow { flex: 1; min-width: 150px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; }
.seg button { border: none; background: var(--card); color: var(--ink-2); padding: 7px 13px;
  font: 600 12px/1.4 inherit; font-family: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button:hover { background: var(--paper-2); color: var(--wood-deep); }
.seg button.on { background: var(--wood); color: #fffaf0; }

.btn { padding: 8px 16px; border: 1px solid transparent; border-radius: 9px; cursor: pointer;
  font-size: 13px; font-weight: 600; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { box-shadow: var(--shadow-2); }
.btn.primary { background: var(--wood); color: #fffaf0; }
.btn.primary:hover { background: var(--wood-deep); }
.btn.ghost { background: var(--card); color: var(--wood-deep); border-color: var(--line-2); }
.btn.ghost:hover { border-color: var(--gold); background: var(--gold-soft); }

.btn.danger { background: #fff4f0; color: var(--bad); border-color: #e6c5ba; }
.btn.danger:hover { background: #fbe4dd; }
.btn[disabled] { opacity: .55; cursor: not-allowed; box-shadow: none; }
input[type=search], input[type=text], input[type=password], textarea, select {

.post .meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }

.modal-mask { position: fixed; inset: 0; z-index: 40; background: rgba(61,58,51,.42);

.notice-bar {

<script>
'use strict';
const TOKEN_KEY = 'gk_token';
const LEGACY_KEY = 'authToken';
const $ = (s) => document.querySelector(s);

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const state = {
  user: null,            // {user_id, username, role}
  mode: 'home',
  category: '',
  sort: 'new',
  page: 1,
  total: 0,
  size: 15,
  detail: null,
  detailLiked: false,
  replyPage: 1,
  replyTotal: 0,
  notice: '',
  pendingAction: '',     // composer | reply（登录成功后继续）
};

function readToken() {
  return localStorage.getItem(TOKEN_KEY) || localStorage.getItem(LEGACY_KEY) || '';
}
function setToken(t) {
  t = t || '';
  if (t) {
    localStorage.setItem(TOKEN_KEY, t);
    localStorage.removeItem(LEGACY_KEY);
  } else {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(LEGACY_KEY);
  }
}

async function apiReq(path, opts) {
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  const isForm = typeof FormData !== 'undefined' && opts.body instanceof FormData;
  if (opts.body !== undefined && !isForm) headers['Content-Type'] = 'application/json';
  const token = readToken();
  if (token) {
    headers['Authorization'] = 'Bearer ' + token;
    // 27-N：公网发布代理会剥离 Authorization 头，冗余携带 X-Auth-Token
    // （自建 nginx 侧转换回 Authorization 传给后端）——与主站 GK.api 口径一致
    headers['X-Auth-Token'] = token;
  }
  const init = { method: opts.method || 'GET', headers: headers };
  if (opts.body !== undefined && init.method !== 'GET') {
    init.body = (typeof opts.body === 'string' || isForm) ? opts.body : JSON.stringify(opts.body);
  }
  const resp = await fetch('/api' + path, init);
  const text = await resp.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch (e) { json = null; }
  if (!resp.ok) {
    // 27-N P2-15：429 限流统一给可操作的提示——detail 可能是英文
    // 或网关整页 HTML（直接透出会满屏标签）
    const detail = resp.status === 429
      ? '操作太频繁了，休息几秒再试吧'
      : ((json && (json.detail || json.message)) || text || ('HTTP ' + resp.status));
    const err = new Error(String(detail));
    err.status = resp.status;
    throw err;
  }
  return json;
}

function showMsg(msg, type) {
  const d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'position:fixed;top:18px;right:18px;z-index:99;padding:10px 18px;border-radius:10px;' +
    'color:#fff;font-size:13.5px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.18);max-width:320px;';
  d.style.background = type === 'error' ? '#b45a4a' : (type === 'success' ? '#7a9e6d' : '#6f4a2d');
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3000);
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  const p = (n) => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
    p(d.getHours()) + ':' + p(d.getMinutes());
}

function isMe(name) {
  return !!(state.user && name && state.user.username === name);
}

function renderAuthArea() {
  const area = $('#authArea');
  if (state.user) {
    area.innerHTML = '<span class="uname">' + esc(state.user.username) + '</span>' +
      '<button class="btn ghost sm" data-act="logout">退出</button>';
  } else {
    area.innerHTML = '<button class="btn ghost sm" data-act="authOpen">登录 / 注册</button>';
  }
}

function openAuth(mode) {
  $('#authTitle').textContent = mode === 'register' ? '注册' : '登录';
  $('#authErr').textContent = '';
  $('#authSwitch').textContent = mode === 'register' ? '已有账号？去登录' : '没有账号？去注册';
  $('#authModal').classList.remove('hidden');
  setTimeout(() => $('#authUsername').focus(), 30);
}
function closeAuth() {
  $('#authModal').classList.add('hidden');
  $('#authErr').textContent = '';
}
function openComposer() {
  if (!state.user) {
    state.pendingAction = 'composer';
    showMsg('请先登录后发帖');
    openAuth('login');
    return;
  }
  $('#composerTitle').textContent = '发布新帖';
  $('#composerTitleIn').value = '';
  $('#composerBody').value = '';
  $('#composerErr').textContent = '';
  $('#composerHint').textContent = '当前分类发布到：' + (state.category || '全部');
  $('#composerCat').value = state.category || '上岸经验';
  $('#composerModal').classList.remove('hidden');
  setTimeout(() => $('#composerTitleIn').focus(), 30);
}
function closeComposer() { $('#composerModal').classList.add('hidden'); }

async function authSubmit() {
  const mode = $('#authTitle').textContent === '注册' ? 'register' : 'login';
  const u = $('#authUsername').value.trim();
  const p = $('#authPassword').value;
  const errEl = $('#authErr');
  if (!u || !p) { errEl.textContent = '请输入用户名和密码'; return; }
  if (mode === 'register' && p.length < 6) { errEl.textContent = '密码至少 6 位'; return; }
  errEl.textContent = '';
  try {
    const d = await apiReq('/' + mode, { method: 'POST', body: { username: u, password: p } });
    setToken(d.token);
    state.user = { user_id: d.user_id, username: d.username || u, role: d.role || 'free' };
    closeAuth();
    renderAuthArea();
    showMsg(mode === 'register' ? '注册成功，欢迎加入！' : '登录成功');
    const pending = state.pendingAction;
    state.pendingAction = '';
    if (pending === 'composer') openComposer();
    else if (pending === 'reply') { $('#replyText').focus(); }
  } catch (e) {
    errEl.textContent = (mode === 'login' ? '登录失败：' : '注册失败：') + e.message;
  }
}

async function loadCats() {
  try {
    const d = await apiReq('/forum/categories');
    const all = d.categories.reduce((s, c) => s + c.count, 0);
    const box = $('#chips');
    const parts = ['<button class="chip' + (state.category ? '' : ' on') + '" data-act="cat" data-c="">全部<em>' + all + '</em></button>'];
    d.categories.forEach(c => {
      parts.push('<button class="chip' + (state.category === c.category ? ' on' : '') + '" data-act="cat" data-c="' + esc(c.category) + '">' +
        esc(c.category) + '<em>' + c.count + '</em></button>');
    });
    box.innerHTML = parts.join('');
    $('#composerCat').innerHTML = d.categories.map(c =>
      '<option value="' + esc(c.category) + '">' + esc(c.category) + '</option>').join('');
  } catch (e) { /* 分类失败不阻塞列表 */ }
}

async function loadPosts() {
  const kw = ($('#kw').value || '').trim();
  const box = $('#postList');
  box.innerHTML = '<div class="loading">加载中…</div>';
  const q = new URLSearchParams({
    sort: state.sort,
    page: String(state.page),
    size: String(state.size),
  });
  if (state.category) q.set('category', state.category);
  if (kw) q.set('keyword', kw);
  try {
    const d = await apiReq('/forum/posts?' + q.toString());
    state.total = d.total || 0;
    renderPosts(d.items || []);
    renderPager();
  } catch (e) {
    box.innerHTML = '<div class="err-tip">加载失败：' + esc(e.message) + '</div>';
  }
}

function renderPosts(items) {
  const box = $('#postList');
  if (!items.length) {
    box.innerHTML = '<div class="empty">这里还很安静，来发第一帖吧 ✍️</div>';
    return;
  }
  box.innerHTML = items.map(p => {
    const mine = isMe(p.username);
    return '<article class="post" data-act="openPost" data-id="' + esc(p.post_id) + '">' +
      '<div class="meta">' +
      '<span class="badge cat">' + esc(p.category) + '</span>' +
      (p.pinned ? '<span class="badge lz">📌 置顶</span>' : '') +
      '<span class="un">' + esc(p.username) + '</span>' +
      '<span>' + fmtTime(p.created_at) + '</span>' +
      (mine ? '<span class="badge lz">楼主</span>' : '') +
      (mine ? '<span class="ops"><button class="btn danger sm" data-act="deletePost" data-id="' + esc(p.post_id) + '">删除</button></span>' : '') +
      '</div>' +
      '<h3>' + esc(p.title) + '</h3>' +
      '<div class="ex">' + esc(p.excerpt || '') + '</div>' +
      '<div class="foot">' +
      '<span class="num">👁 ' + p.views + '</span>' +
      '<span class="num">💬 ' + p.reply_count + '</span>' +
      '<span class="num">👍 ' + p.likes + '</span>' +
      '</div></article>';
  }).join('');
}

function renderPager() {
  const el = $('#pager');
  const totalPage = Math.max(1, Math.ceil(state.total / state.size));
  el.innerHTML = '<button class="btn ghost sm" data-act="page" data-v="prev"' + (state.page <= 1 ? ' disabled' : '') + '>上一页</button>' +
    '<span>' + state.page + ' / ' + totalPage + '</span>' +
    '<button class="btn ghost sm" data-act="page" data-v="next"' + (state.page >= totalPage ? ' disabled' : '') + '>下一页</button>';
}

async function openPost(id) {
  try {
    const p = await apiReq('/forum/posts/' + encodeURIComponent(id));
    state.detail = p;
    state.detailLiked = !!p.liked;
    showHome(false);
    renderDetail();
    await loadReplies(true);
  } catch (e) {
    showMsg('打开失败：' + e.message, 'error');
  }
}

function renderDetail() {
  const p = state.detail;
  const mine = isMe(p.username);
  const box = $('#postDetail');
  box.innerHTML =
    '<h2>' + esc(p.title) + '</h2>' +
    '<div class="dmeta">' +
    '<span class="badge cat">' + esc(p.category) + '</span>' +
    '<span>作者：' + esc(p.username) + '</span>' +
    '<span>' + fmtTime(p.created_at) + '</span>' +
    '<span class="num">👁 ' + p.views + '</span>' +
    '</div>' +
    '<div class="dbody">' + esc(p.content) + '</div>' +
    '<div class="dbar">' +
    '<button class="btn ghost sm act" data-act="likePost">' + (state.detailLiked ? '👍 已赞 ' : '👍 点赞 ') + p.likes + '</button>' +
    (!mine ? '<button class="btn ghost sm act" data-act="reportPost" data-id="' + esc(p.post_id) + '">⚠️ 举报</button>' : '') +
    (mine ? '<button class="btn danger sm" data-act="deletePost" data-id="' + esc(p.post_id) + '">删除本帖</button>' : '') +
    '<button class="btn ghost sm act" data-act="copyLink">复制链接</button>' +
    '</div>';
}

async function loadReplies(reset) {
  if (!state.detail) return;
  if (reset) { state.replyPage = 1; state.replyTotal = 0; }
  const box = $('#replyList');
  try {
    const d = await apiReq('/forum/posts/' + encodeURIComponent(state.detail.post_id) +
      '/replies?page=' + state.replyPage + '&size=50');
    state.replyTotal = d.total || 0;
    box.innerHTML = (d.items || []).length
      ? d.items.map(r => {
          const mine = isMe(r.username);
          return '<div class="reply-item">' +
            '<div class="who"><div class="av">' + esc((r.username || '客')[0]) + '</div>' +
            '<div class="un">' + esc(r.username) + '</div><div class="tm">' + fmtTime(r.created_at) + '</div></div>' +
            '<div class="rbody">' + esc(r.content) +
            '<div style="margin-top:6px">' +
            (mine ? '<button class="btn danger sm" data-act="deleteReply" data-id="' + esc(r.reply_id) + '">删除</button>' : '') +
            (!mine ? '<button class="btn ghost sm rpt" data-act="reportReply" data-id="' + esc(r.reply_id) + '">⚠️ 举报</button>' : '') +
            '</div></div>';
        }).join('')
      : '<div class="empty">暂无回复，来抢沙发～</div>';
  } catch (e) {
    box.innerHTML = '<div class="err-tip">加载失败：' + esc(e.message) + '</div>';
  }
}

function showHome(flag) {
  state.mode = flag ? 'home' : 'detail';
  $('#viewHome').style.display = flag ? '' : 'none';
  $('#viewDetail').style.display = flag ? 'none' : '';
}

async function submitPost() {
  if (!state.user) { state.pendingAction = 'composer'; openAuth('login'); return; }
  const title = $('#composerTitleIn').value.trim();
  const content = $('#composerBody').value.trim();
  const category = $('#composerCat').value;
  const errEl = $('#composerErr');
  if (title.length < 3 || title.length > 80) { errEl.textContent = '标题需 3-80 字'; return; }
  if (content.length < 5 || content.length > 8000) { errEl.textContent = '内容需 5-8000 字'; return; }
  errEl.textContent = '';
  try {
    const p = await apiReq('/forum/posts', {
      method: 'POST',
      body: { title: title, content: content, category: category },
    });
    closeComposer();
    showMsg('发布成功', 'success');
    await loadCats();
    await loadPosts();
  } catch (e) {
    if (e.status === 401) { closeComposer(); state.pendingAction = 'composer'; openAuth('login'); return; }
    errEl.textContent = '发布失败：' + e.message;
  }
}

async function submitReply() {
  if (!state.detail) return;
  if (!state.user) { state.pendingAction = 'reply'; openAuth('login'); return; }
  const content = $('#replyText').value.trim();
  if (!content || content.length > 2000) { showMsg('回复需 1-2000 字', 'error'); return; }
  try {
    await apiReq('/forum/posts/' + encodeURIComponent(state.detail.post_id) + '/replies', {
      method: 'POST', body: { content: content },
    });
    $('#replyText').value = '';
    state.detail.reply_count = (state.detail.reply_count || 0) + 1;
    await loadReplies(true);
    showMsg('回复成功', 'success');
  } catch (e) {
    if (e.status === 401) { state.pendingAction = 'reply'; openAuth('login'); return; }
    showMsg('回复失败：' + e.message, 'error');
  }
}

async function likePost() {
  if (!state.detail) return;
  if (!state.user) { state.pendingAction = 'reply'; openAuth('login'); return; }
  try {
    const d = await apiReq('/forum/posts/' + encodeURIComponent(state.detail.post_id) + '/like', { method: 'POST' });
    state.detail.likes = d.likes;
    state.detailLiked = d.liked;
    renderDetail();
  } catch (e) {
    if (e.status === 401) { openAuth('login'); return; }
    showMsg('操作失败：' + e.message, 'error');
  }
}

async function deletePost(id) {
  if (!window.confirm('确定删除这条帖子？其下全部回复将一并删除。')) return;
  try {
    await apiReq('/forum/posts/' + encodeURIComponent(id), { method: 'DELETE' });
    showMsg('已删除', 'success');
    if (state.detail && state.detail.post_id === id) { showHome(true); }
    await loadCats();
    await loadPosts();
  } catch (e) {
    if (e.status === 401) { openAuth('login'); return; }
    showMsg('删除失败：' + e.message, 'error');
  }
}

async function deleteReply(id) {
  if (!window.confirm('确定删除这条回复？')) return;
  try {
    await apiReq('/forum/replies/' + encodeURIComponent(id), { method: 'DELETE' });
    showMsg('已删除', 'success');
    state.detail.reply_count = Math.max(0, (state.detail.reply_count || 0) - 1);
    await loadReplies(true);
  } catch (e) {
    if (e.status === 401) { openAuth('login'); return; }
    showMsg('删除失败：' + e.message, 'error');
  }
}

async function loadNotice() {
  try {
    const d = await apiReq('/public/forum/notice');
    const bar = $('#noticeBar');
    if (d && d.content && bar) {
      bar.innerHTML = '<b>📢 公告</b><span class="notice-txt">' + esc(d.content) + '</span>';
      bar.style.display = '';
    } else if (bar) { bar.style.display = 'none'; }
  } catch (e) { const bar = $('#noticeBar'); if (bar) bar.style.display = 'none'; }
}

async function reportTarget(kind, id) {
  if (!state.user) { openAuth('login'); return; }
  const v = window.prompt('请简要说明举报原因（留空则按社区规范处理）：');
  if (v === null) return;
  const reason = v.trim().slice(0, 200);
  try {
    await apiReq('/forum/reports', { method: 'POST', body: { target_kind: kind, target_id: id, reason: reason } });
    showMsg('举报已提交，管理员会尽快处理', 'success');
  } catch (e) {
    showMsg('举报失败：' + e.message, 'error');
  }
}

async function bootAuth() {
  if (!readToken()) return;
  try {
    const d = await apiReq('/me');
    // 27-N：anonymous 不再清 token——公网代理偶发剥头时 /me 会回 anonymous，
    // 误清导致用户掉登录；仅 401/403（token 确认失效）才清。
    if (!d || d.anonymous) { renderAuthArea(); return; }
    state.user = { user_id: '', username: d.username, role: d.role };
    renderAuthArea();
  } catch (e) {
    if (e && (e.status === 401 || e.status === 403)) setToken('');
    renderAuthArea();
  }
}

function onClick(ev) {
  const btn = ev.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id || '';
  if (act === 'authOpen') openAuth('login');
  else if (act === 'authClose') closeAuth();
  else if (act === 'authSwitch') {
    const mode = $('#authTitle').textContent === '注册' ? 'login' : 'register';
    openAuth(mode);
  } else if (act === 'authSubmit') authSubmit();
  else if (act === 'logout') {
    state.user = null;
    setToken('');
    renderAuthArea();
    showMsg('已退出登录');
    if (state.detail) { showHome(true); loadPosts(); }
  } else if (act === 'newPostOpen') openComposer();
  else if (act === 'composerCancel') closeComposer();
  else if (act === 'composerSubmit') submitPost();
  else if (act === 'replySubmit') submitReply();
  else if (act === 'likePost') likePost();
  else if (act === 'reportPost') reportTarget('post', id);
  else if (act === 'reportReply') reportTarget('reply', id);
  else if (act === 'copyLink') {
    navigator.clipboard && navigator.clipboard.writeText(location.origin + '/forum.html?id=' + state.detail.post_id)
      .then(() => showMsg('链接已复制', 'success')).catch(() => showMsg('复制失败', 'error'));
  } else if (act === 'backList') { showHome(true); loadPosts(); }
  else if (act === 'deletePost') deletePost(id);
  else if (act === 'deleteReply') deleteReply(id);
  else if (act === 'openPost') { if (!btn.classList.contains('post')) return; openPost(id); }
  else if (act === 'sort') {
    state.sort = btn.dataset.v;
    state.page = 1;
    document.querySelectorAll('#sortSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === state.sort));
    loadPosts();
  } else if (act === 'cat') {
    state.category = btn.dataset.c || '';
    state.page = 1;
    document.querySelectorAll('.chips .chip').forEach(b => b.classList.toggle('on', b.dataset.c === state.category));
    loadPosts();
  } else if (act === 'searchGo') { state.page = 1; loadPosts(); }
  else if (act === 'page') {
    const totalPage = Math.max(1, Math.ceil(state.total / state.size));
    const np = btn.dataset.v === 'prev' ? state.page - 1 : state.page + 1;
    if (np < 1 || np > totalPage) return;
    state.page = np;
    loadPosts();
  }
}

function init() {
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target && e.target.id === 'kw') { state.page = 1; loadPosts(); }
    if (e.key === 'Enter' && e.target && (e.target.id === 'authUsername' || e.target.id === 'authPassword')) authSubmit();
  });
  const qid = new URLSearchParams(location.search).get('id');
  renderAuthArea();
  loadNotice();
  bootAuth().then(() => {
    if (state.user) renderAuthArea();
    return loadCats();
  }).then(() => {
    if (qid) { openPost(qid); return; }
    loadPosts();
  });
}
init();
</script>
