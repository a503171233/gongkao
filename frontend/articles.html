<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
  <link rel="icon" type="image/png" sizes="256x256" href="/img/favicon-256.png">
<title>书山公考 · 备考文章</title>
<!-- 书卷主题：热帖精选 + AI 要点提炼；浏览公开，AI 提炼需登录 -->
<style>
:root {
  --paper:#f6f1e7; --paper-2:#efe7d6; --card:#fffaf0; --card-2:#fbf4e4;
  --ink:#3d3a33; --ink-2:#6b655a; --ink-3:#6E6657;
  --wood:#8b5e3c; --wood-deep:#6f4a2d; --gold:#c9a05a; --gold-deep:#a5813f; --gold-soft:#e6d3ac;
  --good:#7a9e6d; --bad:#b45a4a; --line:#e2d9c6; --line-2:#d2c5ab;
  --shadow-1:0 1px 3px rgba(93,72,41,.08),0 1px 2px rgba(93,72,41,.05);
  --shadow-2:0 6px 20px rgba(93,72,41,.12),0 2px 6px rgba(93,72,41,.06);
  --radius:14px; --radius-s:8px;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Serif SC",serif;
  background:radial-gradient(1200px 500px at 85% -5%,rgba(201,160,90,.09),transparent 60%),
  radial-gradient(900px 420px at -10% 10%,rgba(139,94,60,.07),transparent 55%),var(--paper);
  color:var(--ink); line-height:1.75; -webkit-font-smoothing:antialiased; min-height:100vh; }
a { color:var(--wood-deep); text-decoration:none; }
.knav { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:18px;
  padding:calc(env(safe-area-inset-top, 0px) + 12px) 28px 12px;
  background:rgba(246,241,231,.88); backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:10px; font-weight:800; color:var(--ink); font-size:16px; }
.brand .mark { width:36px; height:36px; border-radius:11px; background:linear-gradient(135deg,var(--wood),var(--gold));
  color:#fffaf0; display:grid; place-items:center; font-size:16px; font-weight:800; box-shadow:var(--shadow-1); }
.knav .links { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; }
.knav .links a { padding:7px 14px; border-radius:9px; font-size:13.5px; color:var(--ink-2); font-weight:600; }
.knav .links a:hover { background:var(--paper-2); color:var(--wood-deep); }
.knav .links a.active { background:var(--gold-soft); color:var(--wood-deep); font-weight:700; }
.wrap { max-width:960px; margin:0 auto; padding:24px 20px 60px; }
.page-head { display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
.page-head h1 { font-size:24px; font-weight:800; }
.page-head p { font-size:13px; color:var(--ink-3); }
.head-side { margin-left:auto; display:flex; gap:8px; align-items:center; }
.uname { font-size:13px; font-weight:700; color:var(--wood-deep); }
.panel { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-1); overflow:hidden; }
.panel-head { padding:12px 18px; border-bottom:1px solid var(--line); }
.chips { display:flex; gap:8px; flex-wrap:wrap; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--card-2); }
.chip { border:1px solid var(--line-2); background:var(--card); color:var(--ink-2); padding:4px 12px;
  border-radius:999px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
.chip:hover { border-color:var(--gold); color:var(--wood-deep); }
.chip.on { background:var(--wood); border-color:var(--wood); color:#fffaf0; }
.chip em { font-style:normal; opacity:.7; margin-left:4px; font-size: 12px; }
.btn { padding:8px 16px; border:1px solid transparent; border-radius:9px; cursor:pointer; font-size:13px;
  font-weight:600; font-family:inherit; display:inline-flex; align-items:center; gap:6px; }
.btn:hover { box-shadow:var(--shadow-2); }
.btn.primary { background:var(--wood); color:#fffaf0; }
.btn.primary:hover { background:var(--wood-deep); }
.btn.ghost { background:var(--card); color:var(--wood-deep); border-color:var(--line-2); }
.btn.ghost:hover { border-color:var(--gold); background:var(--gold-soft); }
.btn.sm { padding:4px 10px; font-size:12px; border-radius:7px; }
.btn[disabled] { opacity:.55; cursor:not-allowed; box-shadow:none; }
input, textarea { font-family:inherit; font-size:14px; color:var(--ink); background:var(--card);
  border:1px solid var(--line-2); border-radius:9px; padding:8px 12px; outline:none; }
input:focus, textarea:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,160,90,.16); }
.badge { display:inline-block; padding:1px 9px; border-radius:999px; font-size: 12px; font-weight:700; }
.badge.cat { background:var(--gold-soft); color:var(--wood-deep); }
.badge.ai { background:rgba(122,158,109,.2); color:var(--good); }
.badge.hot { background:rgba(180,90,74,.14); color:var(--bad); }
.list { padding:6px 0; }
.empty, .loading, .err-tip { text-align:center; padding:42px 16px; color:var(--ink-3); font-size:13px; }
.err-tip { color:var(--bad); }
.art { padding:16px 20px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .15s; }
.art:hover { background:var(--card-2); }
.art .meta { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-3); flex-wrap:wrap; }
.art h3 { font-size:16.5px; font-weight:800; margin:7px 0 5px; line-height:1.5; }
.art .ex { font-size:13px; color:var(--ink-2); display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden; }
.art .foot { display:flex; align-items:center; gap:14px; margin-top:9px; font-size:12px; color:var(--ink-3); flex-wrap:wrap; }
.art .ops { margin-left:auto; }
.aisum { font-size:12px; color:var(--good); background:rgba(122,158,109,.1); border-radius:8px;
  padding:6px 10px; margin-top:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.modal-mask { position:fixed; inset:0; z-index:40; background:rgba(61,58,51,.45); display:grid;
  place-items:center; padding:18px; }
.modal-mask.hidden { display:none; }
.auth-card { width:100%; max-width:420px; background:var(--card); border-radius:16px; box-shadow:var(--shadow-2); padding:22px; }
.reader-card { width:100%; max-width:780px; max-height:88vh; background:var(--card); border-radius:16px;
  box-shadow:var(--shadow-2); display:flex; flex-direction:column; overflow:hidden; }
.reader-scroll { overflow:auto; padding:24px 28px 18px; }
.reader-close { display:flex; justify-content:flex-end; padding:10px 14px 0; }
.mfield { margin-bottom:12px; }
.mfield label { display:block; font-size:12.5px; color:var(--ink-2); margin-bottom:5px; font-weight:600; }
.mfield input { width:100%; }
.mrow { display:flex; gap:10px; justify-content:flex-end; align-items:center; margin-top:16px; }
.form-err { color:var(--bad); font-size:12.5px; min-height:18px; }
.switch-link { font-size:12.5px; cursor:pointer; color:var(--wood-deep); }
.rd-title { font-size:22px; font-weight:800; line-height:1.5; }
.rd-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--ink-3); margin:10px 0 14px; }
.rd-body { font-size:15px; color:var(--ink); white-space:pre-wrap; word-break:break-word; border-top:1px dashed var(--line-2); padding-top:14px; }
.ana-box { margin-top:16px; border:1px solid var(--gold-soft); border-radius:12px; background:rgba(201,160,90,.07); padding:14px 16px; }
.ana-box h4 { font-size:13.5px; color:var(--wood-deep); margin-bottom:8px; }
.ana-sum { font-size:13.5px; color:var(--ink); }
.ana-kp { margin:8px 0 4px; padding-left:2px; }
.ana-kp li { font-size:13px; color:var(--ink-2); margin:3px 0 3px 18px; }
.ana-adv { font-size:13px; color:var(--good); background:rgba(122,158,109,.1); border-radius:8px; padding:6px 10px; }
.reply-prev { margin-top:14px; border-top:1px solid var(--line); }
.reply-prev h5 { font-size:12.5px; color:var(--ink-3); padding:10px 0 2px; }
.rp-item { padding:8px 0; border-bottom:1px dashed var(--line); font-size:13px; color:var(--ink-2); }
.rp-item b { color:var(--wood-deep); font-weight:600; }
.rd-foot { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
@media (max-width:820px) {
  .knav { flex-wrap:wrap; padding:calc(env(safe-area-inset-top, 0px) + 10px) 14px; }
  .wrap { padding:16px 12px 50px; }
  .reader-scroll { padding:16px; }
}

/* ============ 批次24 · 移动端最高标准 ============ */
@media (max-width:480px) {
  .knav { flex-wrap:nowrap; padding:calc(env(safe-area-inset-top, 0px) + 9px) 12px; gap:10px; }
  .brand { flex:0 0 auto; font-size:14.5px; gap:8px; min-height:40px; display:inline-flex; align-items:center; }
  .brand .mark { width:30px; height:30px; border-radius:9px; font-size:13px; }
  .knav .links {
    margin-left:0; overflow-x:auto; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; white-space:nowrap; flex-wrap:nowrap;
    flex:1 1 auto; min-width:0;   /* 27-M3：显式允许收缩，横滑区不撑破顶栏 */
  }
  .knav .links::-webkit-scrollbar { display:none; }
  .knav .links a {
    flex:0 0 auto; white-space:nowrap; font-size:13px;
    padding:8px 10px; min-height:38px; display:inline-flex; align-items:center;
  }
  .wrap { padding:14px 12px 46px; }
  .reader-scroll { padding:14px; border-radius:12px; }
  button, .head-btn, .btn { min-height:40px; }
}
</style>
</head>
<body>
<nav class="knav">
  <a class="brand" href="/"><span class="mark">书</span>书山公考</a>
  <div class="links">
    <a href="/">首页</a>
    <a href="/chat.html">学习中心</a>
    <a href="/knowledge.html">知识体系</a>
    <a href="/forum.html">论坛</a>
    <a href="/articles.html" class="active">备考文章</a>
  </div>
</nav>

<div class="wrap">
  <div class="page-head">
    <div>
      <h1>📄 备考文章 · 经验精选</h1>
      <p>从论坛热帖中精选高分经验 · 支持 AI 提炼干货要点（登录后可生成）</p>
    </div>
    <div class="head-side" id="authArea"></div>
  </div>

  <div class="panel">
    <div class="chips" id="chips"></div>
    <div class="list" id="artList"><div class="loading">加载中…</div></div>
  </div>
</div>

<div class="modal-mask hidden" id="readerModal">
  <div class="reader-card">
    <div class="reader-close"><button class="btn ghost sm" data-act="readerClose">✕ 关闭</button></div>
    <div class="reader-scroll" id="readerBox"></div>
  </div>
</div>

<div class="modal-mask hidden" id="authModal">
  <div class="auth-card">
    <h3 id="authTitle" style="margin-bottom:12px">登录</h3>
    <div class="mfield"><label>用户名</label><input type="text" id="authUsername" autocomplete="username" maxlength="40"></div>
    <div class="mfield"><label>密码</label><input type="password" id="authPassword" autocomplete="current-password"></div>
    <div class="form-err" id="authErr"></div>
    <div class="mrow">
      <span class="switch-link" id="authSwitch" data-act="authSwitch">没有账号？去注册</span>
      <button class="btn ghost sm" data-act="authClose">取消</button>
      <button class="btn primary sm" data-act="authSubmit">登录</button>
    </div>
  </div>
</div>

<script>
'use strict';
const TOKEN_KEY = 'gk_token';
const LEGACY_KEY = 'authToken';
const $ = (s) => document.querySelector(s);
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const state = {
  user: null, category: '', list: [],
  reader: null, readerAnalysis: null, readerId: '',
  pendingAnalyze: '',
};
function readToken(){ return localStorage.getItem(TOKEN_KEY) || localStorage.getItem(LEGACY_KEY) || ''; }
function setToken(t){
  t = t || '';
  if (t) { localStorage.setItem(TOKEN_KEY, t); localStorage.removeItem(LEGACY_KEY); }
  else { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(LEGACY_KEY); }
}
async function apiReq(path, opts) {
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  const isForm = typeof FormData !== 'undefined' && opts.body instanceof FormData;
  if (opts.body !== undefined && !isForm) headers['Content-Type'] = 'application/json';
  const token = readToken();
  if (token) {
    headers['Authorization'] = 'Bearer ' + token;
    // 27-N：公网发布代理会剥离 Authorization 头，冗余携带 X-Auth-Token
    // （自建 nginx 侧转换回 Authorization 传给后端）——与主站 GK.api 口径一致
    headers['X-Auth-Token'] = token;
  }
  const init = { method: opts.method || 'GET', headers: headers };
  if (opts.body !== undefined && init.method !== 'GET')
    init.body = (typeof opts.body === 'string' || isForm) ? opts.body : JSON.stringify(opts.body);
  const resp = await fetch('/api' + path, init);
  const text = await resp.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch (e) { json = null; }
  if (!resp.ok) {
    const detail = (json && (json.detail || json.message)) || text || ('HTTP ' + resp.status);
    const err = new Error(String(detail)); err.status = resp.status; throw err;
  }
  return json;
}
function showMsg(msg, type) {
  const d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'position:fixed;top:18px;right:18px;z-index:99;padding:10px 18px;border-radius:10px;color:#fff;' +
    'font-size:13.5px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.18);max-width:320px;';
  d.style.background = type === 'error' ? '#b45a4a' : (type === 'success' ? '#7a9e6d' : '#6f4a2d');
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3000);
}
function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  const p = n => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function renderAuthArea() {
  const area = $('#authArea');
  area.innerHTML = state.user
    ? '<span class="uname">' + esc(state.user.username) + '</span><button class="btn ghost sm" data-act="logout">退出</button>'
    : '<button class="btn ghost sm" data-act="authOpen">登录 / 注册</button>';
}
function openAuth(mode) {
  $('#authTitle').textContent = mode === 'register' ? '注册' : '登录';
  $('#authErr').textContent = '';
  $('#authSwitch').textContent = mode === 'register' ? '已有账号？去登录' : '没有账号？去注册';
  $('#authModal').classList.remove('hidden');
  setTimeout(() => $('#authUsername').focus(), 30);
}
function closeAuth(){ $('#authModal').classList.add('hidden'); $('#authErr').textContent=''; }
async function authSubmit() {
  const mode = $('#authTitle').textContent === '注册' ? 'register' : 'login';
  const u = $('#authUsername').value.trim();
  const p = $('#authPassword').value;
  const errEl = $('#authErr');
  if (!u || !p) { errEl.textContent = '请输入用户名和密码'; return; }
  if (mode === 'register' && p.length < 6) { errEl.textContent = '密码至少 6 位'; return; }
  errEl.textContent = '';
  try {
    const d = await apiReq('/' + mode, { method:'POST', body:{ username:u, password:p } });
    setToken(d.token);
    state.user = { user_id:d.user_id, username:d.username || u, role:d.role || 'free' };
    closeAuth(); renderAuthArea();
    showMsg(mode === 'register' ? '注册成功，欢迎加入！' : '登录成功', 'success');
    const pid = state.pendingAnalyze;
    state.pendingAnalyze = '';
    if (pid) { if (state.reader && state.reader.post_id === pid) { await doAnalyze(); } }
  } catch (e) { errEl.textContent = (mode === 'login' ? '登录失败：' : '注册失败：') + e.message; }
}
async function loadCats() {
  try {
    const d = await apiReq('/forum/categories');
    const all = d.categories.reduce((s,c)=>s+c.count,0);
    const keep = ['上岸经验','备考求助','申论','面试','闲聊交流'];
    const items = d.categories.filter(c => keep.indexOf(c.category) !== -1);
    if (!items.length) items.push({ category:'上岸经验', count:0 });
    const parts = ['<button class="chip'+(state.category?'':' on')+'" data-act="cat" data-c="">全部<em>'+all+'</em></button>'];
    items.forEach(c => parts.push('<button class="chip'+(state.category===c.category?' on':'')+'" data-act="cat" data-c="'+esc(c.category)+'">'+esc(c.category)+'<em>'+c.count+'</em></button>'));
    $('#chips').innerHTML = parts.join('');
  } catch (e) { $('#chips').innerHTML = ''; }
}
async function loadHome() {
  const box = $('#artList');
  box.innerHTML = '<div class="loading">加载中…</div>';
  try {
    const q = state.category ? ('?category=' + encodeURIComponent(state.category)) : '';
    const d = await apiReq('/articles/home' + q);
    state.list = d.items || [];
    renderList();
  } catch (e) { box.innerHTML = '<div class="err-tip">加载失败：' + esc(e.message) + '</div>'; }
}
function renderList() {
  const box = $('#artList');
  if (!state.list.length) {
    box.innerHTML = '<div class="empty">暂无精选内容——论坛出现高分经验帖后会自动出现在这里。</div>';
    return;
  }
  box.innerHTML = state.list.map(p =>
    '<article class="art" data-act="openArt" data-id="' + esc(p.post_id) + '">' +
    '<div class="meta"><span class="badge cat">' + esc(p.category) + '</span>' +
    (p.likes >= 3 ? '<span class="badge hot">🔥 高赞</span>' : '') +
    (p.analyzed ? '<span class="badge ai">🧠 已提炼</span>' : '') +
    '<span>' + esc(p.username) + '</span><span>' + fmtTime(p.created_at) + '</span></div>' +
    '<h3>' + esc(p.title) + '</h3>' +
    '<div class="ex">' + esc(p.excerpt || '') + '</div>' +
    '<div class="foot"><span>👁 ' + p.views + '</span><span>💬 ' + p.reply_count + '</span>' +
    '<span>👍 ' + p.likes + '</span>' +
    '<span class="ops"><button class="btn primary sm" data-act="openArt" data-id="' + esc(p.post_id) + '">阅读全文</button></span></div>' +
    (p.analysis_summary ? '<div class="aisum">🧠 ' + esc(p.analysis_summary) + '</div>' : '') +
    '</article>').join('');
}
async function openReader(id) {
  try {
    const d = await apiReq('/articles/' + encodeURIComponent(id));
    state.reader = d; state.readerId = d.post_id;
    state.readerAnalysis = d.analysis || null;
    $('#readerModal').classList.remove('hidden');
    renderReader();
  } catch (e) { showMsg('打开失败：' + e.message, 'error'); }
}
function renderReader() {
  const p = state.reader;
  const box = $('#readerBox');
  let ana = '';
  if (state.readerAnalysis) {
    ana = '<div class="ana-box"><h4>🧠 AI 要点提炼</h4>' +
      '<div class="ana-sum">' + esc(state.readerAnalysis.summary || '') + '</div>' +
      (state.readerAnalysis.key_points && state.readerAnalysis.key_points.length ?
        '<ul class="ana-kp">' + state.readerAnalysis.key_points.map(k => '<li>' + esc(k) + '</li>').join('') + '</ul>' : '') +
      (state.readerAnalysis.advice ? '<div class="ana-adv">💡 ' + esc(state.readerAnalysis.advice) + '</div>' : '') +
      '<div style="margin-top:10px"><button class="btn ghost sm" data-act="goForum">去论坛参与讨论 →</button></div></div>';
  } else {
    ana = '<div class="ana-box"><h4>🧠 未提炼要点</h4>' +
      '<div class="ana-sum">该经验帖尚未生成 AI 提炼。登录后点击下方按钮，AI 将结合正文与回帖提炼干货要点。</div>' +
      '<div style="margin-top:10px"><button class="btn primary sm" data-act="runAnalyze">✨ AI 提炼要点' +
      (state.user ? '' : '（需登录）') + '</button></div></div>';
  }
  const replies = (p.replies || []).length
    ? '<div class="reply-prev"><h5>精选回帖（前 3 条）</h5>' +
      p.replies.map(r => '<div class="rp-item"><b>' + esc(r.username) + '：</b>' + esc(r.content) + '</div>').join('') +
      '</div>'
    : '';
  box.innerHTML =
    '<h2 class="rd-title">' + esc(p.title) + '</h2>' +
    '<div class="rd-meta"><span class="badge cat">' + esc(p.category) + '</span>' +
    '<span>作者：' + esc(p.username) + '</span><span>' + fmtTime(p.created_at) + '</span>' +
    '<span>👁 ' + p.views + '</span><span>💬 ' + p.reply_count + '</span><span>👍 ' + p.likes + '</span></div>' +
    '<div class="rd-body">' + esc(p.content) + '</div>' + ana + replies +
    '<div class="rd-foot"><button class="btn ghost sm" data-act="goForum">打开原帖讨论</button></div>';
}
async function doAnalyze() {
  const pid = state.reader && state.reader.post_id;
  if (!pid) return;
  if (!state.user) { state.pendingAnalyze = pid; openAuth('login'); return; }
  const btn = document.querySelector('[data-act="runAnalyze"]');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ AI 提炼中…'; }
  try {
    const d = await apiReq('/articles/analyze', { method:'POST', body:{ post_id: pid } });
    state.readerAnalysis = d.analysis;
    if (d.cached) showMsg('已使用缓存的提炼结果', 'success');
    else showMsg('AI 提炼完成', 'success');
    renderReader();
    const found = state.list.find(x => x.post_id === pid);
    if (found) { found.analyzed = true; found.analysis_summary = (d.analysis.summary || '').slice(0, 120); }
    renderList();
  } catch (e) {
    if (e.status === 401) { state.pendingAnalyze = pid; openAuth('login'); return; }
    if (btn) { btn.disabled = false; btn.textContent = '✨ 重试 AI 提炼'; }
    showMsg('提炼失败：' + e.message, 'error');
  }
}
async function bootAuth() {
  if (!readToken()) return;
  try {
    const d = await apiReq('/me');
    // 27-N：anonymous 不再清 token（防公网代理偶发剥头误清）；仅 401/403 才清
    if (!d || d.anonymous) { renderAuthArea(); return; }
    state.user = { user_id:'', username:d.username, role:d.role };
    renderAuthArea();
  } catch (e) {
    if (e && (e.status === 401 || e.status === 403)) setToken('');
    renderAuthArea();
  }
}
function onClick(ev) {
  const btn = ev.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id || '';
  if (act === 'authOpen') openAuth('login');
  else if (act === 'authClose') closeAuth();
  else if (act === 'authSwitch') openAuth($('#authTitle').textContent === '注册' ? 'login' : 'register');
  else if (act === 'authSubmit') authSubmit();
  else if (act === 'logout') {
    state.user = null; setToken(''); renderAuthArea(); showMsg('已退出登录');
  } else if (act === 'openArt') openReader(id);
  else if (act === 'readerClose') { $('#readerModal').classList.add('hidden'); }
  else if (act === 'runAnalyze') doAnalyze();
  else if (act === 'goForum') {
    window.location.href = '/forum.html?id=' + encodeURIComponent(state.reader.post_id);
  } else if (act === 'cat') {
    state.category = btn.dataset.c || '';
    document.querySelectorAll('.chips .chip').forEach(b => b.classList.toggle('on', b.dataset.c === state.category));
    loadHome();
  }
}
function init() {
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') $('#readerModal').classList.add('hidden');
    if (e.key === 'Enter' && (e.target.id === 'authUsername' || e.target.id === 'authPassword')) authSubmit();
  });
  renderAuthArea();
  bootAuth().then(loadCats).then(loadHome);
}
init();
</script>
