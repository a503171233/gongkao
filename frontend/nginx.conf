limit_req_zone $binary_remote_addr zone=ask_zone:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=3r/m;

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 大课件上传（PPT/PDF 常 10-50MB），放宽 body 限制
    client_max_body_size 50m;

    # 问答（SSE 流式，禁缓冲；加频率限制防刷 token）
    # 超时 300s：LLM 生成可能较慢（黄金集实测最慢 121s），120s 会误杀 → 504
    location /api/ask {
        limit_req zone=ask_zone burst=10 nodelay;
        proxy_pass http://backend:9000/ask;
        # 透传原始 Host（$http_host 保留端口；$host 剥端口会让后端 CSRF Origin 校验误判 403）
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 上传（限频更严：3次/分钟，防恶意灌盘/污染知识库）
    location /api/upload {
        limit_req zone=upload_zone burst=3;
        proxy_pass http://backend:9000/upload;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # 其余 API（题库 AI 采集/提取等 LLM 长任务：放宽到 600s，#26 问题1 修复长文档提取超时）
    location /api/ {
        proxy_pass http://backend:9000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /admin {
        return 302 /admin.html;
    }
    location = /admin/ {
        return 302 /admin.html;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}