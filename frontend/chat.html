<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书山公考 · 学习中心</title>
<link rel="stylesheet" href="/css/app.css">
<!-- 对话站专属内联微调（书卷主题下补充少量细节） -->
<style>
  /* 侧栏书卷信息区已在 app.css 定义；此处补一个占位提示 */
</style>
</head>
<body>
<div class="layout">
<aside id="sidebar">
  <!-- 当前老师书卷信息（JS 渲染） -->
  <div id="sideVol">
    <div class="sv-name" id="svName">书卷加载中…</div>
    <div id="svBody"></div>
  </div>
  <h3>💬 会话历史</h3>
  <button id="newSessionBtn">＋ 新会话</button>
  <div id="sessionList"></div>
</aside>
<div id="main">
<header>
  <a class="home-link" href="/" title="返回官网首页">⌂ 官网首页</a>
  <div class="logo">书</div>
  <h1>书山公考 · 学习中心</h1>
  <div class="teacher-tabs" id="teacherTabs"></div>
  <div id="info">加载中…</div>
  <div id="authArea"></div>
  <button id="c4StudyBtn" onclick="C4.openPractice()">📚 练习</button>
  <button id="c4ReportBtn" onclick="C4.openReport()">📊 报告</button>
  <button id="c4FavBtn" onclick="C4.openFavorites()">📌 收藏</button>
  <button id="c4MistBtn" onclick="C4.openMistakes()">❌ 错题本</button>
  <button id="c5MockBtn" onclick="C5.openMockExam()">📝 模考</button>
  <button id="c6SmartBtn" onclick="C6.openSmartExam()">🧩 组卷</button>
  <button id="c8Btn" onclick="C8.openIncentive()">🏆 激励</button>
  <button id="c9ReportBtn" onclick="C9.openReport()">📈 报告</button>
  <button id="c4ForumBtn" onclick="location.href='/forum.html'">💬 论坛</button>
  <button id="c7MsgBtn" style="position:relative" onclick="C7.openMessages()" title="消息中心">🔔 消息<span id="msgBadge" style="display:none;position:absolute;top:-6px;right:-8px;background:#e03131;color:#fff;font-size:10.5px;line-height:16px;min-width:16px;padding:0 5px;border-radius:8px;text-align:center">0</span></button>
</header>
<div id="chat">
  <div class="hint">我是老师的专属智能助教。<br>所有回答均基于对应老师的课件与讲义，杜绝凭空编造。<br>请选择上方老师，然后提问。</div>
</div>
<div id="uploadbar">
  <div class="inner">
    <span>📤 知识库管理：</span>
    <input type="file" id="fileInput" accept=".md,.txt,.docx,.pptx,.pdf">
    <button id="uploadBtn">上传入库</button>
    <span id="uploadStatus"></span>
  </div>
</div>
<div id="inputbar">
  <div class="inner">
    <input id="query" type="text" placeholder="输入你的问题…" autocomplete="off">
    <button id="send">发送</button>
  </div>
</div>

<!-- 登录/注册模态框 -->
<div id="authModal" class="modal-mask hidden">
  <div class="modal">
    <h2 id="authTitle">登录</h2>
    <div class="err" id="authErr"></div>
    <div class="ok hidden" id="authOk"></div>
    <input id="authUsername" type="text" placeholder="用户名" autocomplete="off">
    <input id="authPassword" type="password" placeholder="密码（至少 6 位）">
    <div class="row">
      <button class="cancel" onclick="closeAuthModal()">取消</button>
      <button class="submit" id="authSubmitBtn">登录</button>
    </div>
    <div class="divider"><span>或</span></div>
    <button class="gitee-btn" id="giteeLoginBtn" onclick="giteeLogin()">🦊 使用 Gitee 登录</button>
    <div class="switch" id="authSwitch">没有账号？去注册</div>
    <div class="switch" style="margin-top:2px;font-size:12px;color:#888;cursor:pointer" onclick="GK.openForgotPassword()">忘记密码？找回</div>
  </div>
</div>

<script src="js/a4-request.js?v=20260906" defer></script>
<script src="js/a2-teacher.js?v=20260905" defer></script>
<script src="js/a5-render.js?v=20260906b" defer></script>
<script src="js/a1-auth.js?v=20260908a" defer></script>
<script src="js/a3-session.js?v=20260906" defer></script>
<script src="js/c4-study.js?v=20260908a" defer></script>
<script src="js/c5-mockexam.js?v=20260907a" defer></script>
<script src="js/c6-smartexam.js?v=20260908a" defer></script>
<script src="js/c7-messages.js?v=20260908a" defer></script>
<script src="js/c8-incentive.js?v=20260908a" defer></script>
<script src="js/c9-learning-report.js?v=20260908b" defer></script>
<script>
// 会话编排由 A3 模块（js/a3-session.js）负责：列表/新建/删除/历史加载/发送，
// 全部走 GK.api/GK.sse，通过 GK.bus 广播渲染协议事件。
// 结果渲染由 A5 模块（js/a5-render.js）负责：订阅 render:clear / history:loaded
// / ask:* 事件，实现流式增量、引用、幻觉拦截、拒答样式、历史回放，本文件不再拼渲染 DOM。
</script>
<script>
// ---------- 知识库管理（B2/上传入库，保留原逻辑；会话/问答由 A3/A5 接管） ----------
document.getElementById('uploadBtn').onclick = async () => {
  const f = document.getElementById('fileInput').files[0];
  if (!f) return;
  const st = document.getElementById('uploadStatus');
  st.textContent = '上传中…';
  const fd = new FormData();
  fd.append('file', f);

  const doUpload = async (secret) => {
    const headers = {};
    if (secret) headers['X-Upload-Secret'] = secret;
    const r = await fetch(`/api/upload?teacher_id=${GK.store.teacherId}`, {
      method: 'POST', body: fd, headers
    });
    if (r.status === 403 && !secret) return null;  // 需要密钥
    if (r.status === 403) throw new Error('密钥无效');
    return r.json();
  };

  try {
    let d = await doUpload(localStorage.getItem('uploadSecret') || '');
    if (d === null) {
      // 后端要求密钥：询问并记住
      const secret = prompt('该平台上传需密钥（请向管理员索取）：');
      if (!secret) { st.textContent = '已取消'; return; }
      localStorage.setItem('uploadSecret', secret);
      d = await doUpload(secret);
    }
    st.textContent = `✅ ${d.filename}: ${d.chunks} 块入库，共 ${d.total} 块`;
    GK.loadInfo();  // 刷新当前老师知识库规模（A2）
  } catch (e) {
    if (e.message === '密钥无效') localStorage.removeItem('uploadSecret');
    st.textContent = '❌ 上传失败: ' + e.message;
  }
};

// ---------- 全局薄封装（兼容 a1-auth.js logout 的联动调用） ----------
function newSession() { if (window.GK && GK.newSession) GK.newSession(); }
function loadSessions() { if (window.GK && GK.loadSessions) GK.loadSessions(); }

// ================= 登录/注册/账号（A1 模块：js/a1-auth.js） =================
// index.html 只保留模态框事件委托与启动调用；业务逻辑在 GK.* 方法内。
// 兼容旧调用名：保留薄封装，保证行内历史代码/内联 onclick 仍可用。
function openAuthModal(mode) { if (window.GK && GK.openAuthModal) GK.openAuthModal(mode); }
function closeAuthModal() { if (window.GK && GK.closeAuthModal) GK.closeAuthModal(); }
function authAction() { if (window.GK && GK.authAction) GK.authAction(); }
function giteeLogin() { if (window.GK && GK.giteeLogin) GK.giteeLogin(); }
function loadAuthUser() { if (window.GK && GK.loadAuthUser) GK.loadAuthUser(); }
function renderAuthArea() { if (window.GK && GK.renderAuthArea) GK.renderAuthArea(); }
function logout() { if (window.GK && GK.logout) GK.logout(); }

// 模态框事件绑定（业务在 GK）
const authSubmitBtn = document.getElementById('authSubmitBtn');
const authSwitchEl = document.getElementById('authSwitch');
const authPwdEl = document.getElementById('authPassword');
const authModalEl = document.getElementById('authModal');
if (authSubmitBtn) authSubmitBtn.onclick = authAction;
if (authSwitchEl) authSwitchEl.onclick = () => openAuthModal(
  (authSwitchEl.textContent || '').indexOf('去注册') !== -1 ? 'register' : 'login');
if (authPwdEl) authPwdEl.onkeydown = e => { if (e.key === 'Enter') authAction(); };
if (authModalEl) authModalEl.addEventListener('click', e => {
  if (e.target.id === 'authModal') closeAuthModal();
});

// 启动编排（A2/A3/A5 defer 已先执行，DOM 就绪后绑定）
document.addEventListener('DOMContentLoaded', function () {
  if (window.GK && GK.initTeacher) GK.initTeacher();  // A2 自举兜底，此处幂等
  if (window.GK && GK.initSession) GK.initSession();  // A3 编排（幂等）
  if (window.C7 && typeof C7.init === 'function') { try { C7.init(); } catch (e) {} }  // #19 消息角标轮询
  try {
    var hasToken = !!(localStorage.getItem('gk_token') || localStorage.getItem('authToken'));
    if (hasToken && new URLSearchParams(location.search).get('mt') === 'mock' &&
        window.C5 && typeof C5.openMockExam === 'function') {
      setTimeout(function () { try { C5.openMockExam(); } catch (e) {} }, 900);
    }
  } catch (e) {}
});

// ============ 侧栏书卷信息（官网→主站联动） ============
// 监听 teacher:changed，拉取当前老师 /info + /documents，渲染 #sideVol 书卷区。
(function () {
  'use strict';
  var svName = document.getElementById('svName');
  var svBody = document.getElementById('svBody');
  if (!svName || !svBody) return;  // 元素缺失则不启用（幂等）

  function shortName(n) {
    var s = String(n || '');
    return s.replace(/^【[^】]*】/, '').replace(/\[副本\]/g, '').replace(/\.(pdf|md|docx?|pptx?)$/i, '').slice(0, 22);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  async function renderSideVol(tid) {
    var teacherId = tid || (window.GK && GK.store.teacherId) || 'T001';
    svName.textContent = '书卷加载中…';
    svBody.innerHTML = '';
    try {
      // 并行拉老师信息与书卷列表
      var infoP = window.GK && GK.api
        ? GK.api('/info?teacher_id=' + encodeURIComponent(teacherId))
        : Promise.reject(new Error('no api'));
      var docsP = window.GK && GK.api
        ? GK.api('/documents?teacher_id=' + encodeURIComponent(teacherId))
        : Promise.reject(new Error('no api'));
      var info = null, docs = [];
      try { info = await infoP; } catch (e) {}
      try { var d = await docsP; docs = (d && d.documents) || []; } catch (e) {}

      svName.textContent = info && info.teacher_name
        ? info.teacher_name + ' · ' + (info.teacher_subject || '')
        : teacherId;
      svName.title = teacherId;

      if (!docs.length) {
        svBody.innerHTML = '<div class="sv-empty">该老师书卷编目中，先来提问吧。</div>';
        return;
      }
      var html = '';
      var shown = 0;
      docs.forEach(function (doc) {
        if (!doc || !doc.doc_name) return;
        if (shown >= 8) return;
        shown++;
        html +=
          '<div class="sv-vol">' +
            '<span class="sv-vname" title="' + esc(doc.doc_name) + '">' + esc(shortName(doc.doc_name)) + '</span>' +
            '<span class="sv-vchunks">' + (doc.chunks || 0) + ' 块</span>' +
          '</div>';
      });
      if (docs.length > shown) {
        html += '<div class="sv-more">… 等 ' + docs.length + ' 部书卷</div>';
      }
      svBody.innerHTML = html;
    } catch (e) {
      console.warn('[sideVol] 渲染失败:', e && e.message ? e.message : e);
      svBody.innerHTML = '<div class="sv-empty">书卷加载失败，请稍后刷新。</div>';
    }
  }

  // 监听切换事件（A2 在 switchTeacher 成功后广播）
  if (window.GK && GK.bus) {
    GK.bus.addEventListener('teacher:changed', function (ev) {
      renderSideVol(ev && ev.detail && ev.detail.teacherId);
    });
  }
  // 页面就绪后渲染一次（对应默认老师 / URL 直达老师）
  setTimeout(function () { renderSideVol(); }, 50);
})();
</script>
</div><!-- /#main -->
</div><!-- /.layout -->
</body>
</html>
