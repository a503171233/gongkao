[pytest]
# ============================================================
# 测试体系配置（#8 测试体系整理）
# ============================================================
# 本项目测试分两类：
#   1. 脚本风格单测（test_*.py 顶层执行 + sys.exit/assert）——由 run_tests.py 统一运行
#   2. 真 pytest 风格（test_36_practice.py / test_mockexam.py）——由 pytest 收集
#
# 脚本风格测试在 import 阶段即触发 sys.exit，若被 pytest 收集会 INTERNALERROR。
# 故此处用 python_files 仅显式收录「真 pytest 风格」文件，脚本风格交给 run_tests.py。
python_files = test_36_practice.py test_mockexam.py
testpaths = tests
addopts = -q
